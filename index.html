<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
</head><body><iframe id="p" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<script>
var q=new URLSearchParams(location.search),v=q.get("v"),vm=q.get("vm"),a=location.ancestorOrigins;
var ok=window.top!==window&&(!a||/^(capacitor|https?):\/\/localhost$/.test(a[a.length-1]));
if(ok&&v)document.getElementById("p").src="https://www.youtube.com/embed/"+encodeURIComponent(v)+"?playsinline=1&rel=0&modestbranding=1&autoplay="+(q.get("autoplay")||0)+"&origin="+location.origin;
if(ok&&vm)document.getElementById("p").src="https://player.vimeo.com/video/"+encodeURIComponent(vm)+"?"+(q.get("q")||"");
</script></body></html>
